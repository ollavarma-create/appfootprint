name: AppImage build (experimental)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/appimage.yml"
      - "scripts/build-appimage.sh"
      - "packaging/**"
      - "assets/**"
      - "src/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      VIRTUAL_ENV: ${{ github.workspace }}/.build-venv
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libfuse2 desktop-file-utils appstream \
            libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0
          python -m venv "$VIRTUAL_ENV"
          # Keep pip itself stable and constrain all direct build dependencies.
          "$VIRTUAL_ENV/bin/python" -m pip install 'pip==25.1.1'
          "$VIRTUAL_ENV/bin/python" -m pip install 'PySide6==6.8.3' 'Nuitka==2.7.12' 'ordered-set==4.1.0' 'zstandard==0.23.0'
          "$VIRTUAL_ENV/bin/python" -m pip install -e '.[dev]'
          "$VIRTUAL_ENV/bin/python" -m pip check
      - name: Unit tests
        run: |
          "$VIRTUAL_ENV/bin/python" -m pytest -q
          "$VIRTUAL_ENV/bin/python" -m compileall -q src/appfootprint
      - name: Desktop metadata
        run: |
          desktop-file-validate packaging/appfootprint.desktop
          appstreamcli validate --no-net packaging/io.github.ollavarma_create.appfootprint.metainfo.xml
      - name: Install verified AppImage packaging tools
        run: |
          set -euo pipefail
          # Immutable release assets; SHA256 values are recorded independently
          # in public third-party build manifests. Never use "continuous".
          TOOL_VERSION="1.9.1"
          TOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          RUNTIME_VERSION="20251108"
          RUNTIME_SHA256="2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/${TOOL_VERSION}/appimagetool-x86_64.AppImage" \
            -o /tmp/appimagetool.AppImage
          printf '%s  %s\n' "$TOOL_SHA256" /tmp/appimagetool.AppImage | sha256sum -c -
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/type2-runtime/releases/download/${RUNTIME_VERSION}/runtime-x86_64" \
            -o /tmp/appimage-runtime-x86_64
          printf '%s  %s\n' "$RUNTIME_SHA256" /tmp/appimage-runtime-x86_64 | sha256sum -c -
          chmod +x /tmp/appimagetool.AppImage
          (cd /tmp && /tmp/appimagetool.AppImage --appimage-extract >/dev/null)
          sudo install -m 0755 /tmp/squashfs-root/usr/bin/appimagetool /usr/local/bin/appimagetool
          echo "APPIMAGE_RUNTIME_FILE=/tmp/appimage-runtime-x86_64" >> "$GITHUB_ENV"
      - name: Build AppImage
        run: |
          export PATH="$VIRTUAL_ENV/bin:$PATH"
          bash scripts/build-appimage.sh
      - name: Check output
        run: |
          test -s dist/AppFootprint-x86_64.AppImage
          (cd dist && sha256sum -c AppFootprint-x86_64.AppImage.sha256)
      - name: AppImage launch smoke test (headless Qt)
        run: |
          python - <<'PY'
          import os
          import subprocess
          import time
          env = os.environ.copy()
          env['QT_QPA_PLATFORM'] = 'offscreen'
          env['QT_DEBUG_PLUGINS'] = '1'
          process = subprocess.Popen(['./dist/AppFootprint-x86_64.AppImage'], env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          try:
              time.sleep(5)
              if process.poll() is not None:
                  output = process.communicate(timeout=5)[0]
                  raise SystemExit(f'AppImage exited during startup (code {process.returncode}):\\n{output}')
              print('AppImage stayed alive for 5 seconds with Qt offscreen platform')
          finally:
              process.terminate() if process.poll() is None else None
              try:
                  output = process.communicate(timeout=5)[0]
                  print(output[-4000:])
                  if 'QtCore-postLoad' in output or 'Fatal Python error' in output:
                      raise SystemExit('Bundled PySide6 emitted a startup error')
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.communicate()
          PY
      - name: Upload build artifact (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AppFootprint-x86_64-ubuntu2204
          path: |
            dist/AppFootprint-x86_64.AppImage
            dist/AppFootprint-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14
